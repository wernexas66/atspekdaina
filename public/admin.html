<!DOCTYPE html>
<html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:20px auto;padding:0 12px}input,button{font:inherit;padding:10px;font-size:16px}.r{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #ccc}.r span{flex:1;overflow:hidden;text-overflow:ellipsis}.r button{padding:6px 8px;font-size:14px}#o{margin-top:12px}.err{color:#b00}.tag{display:inline-block;background:#eee;border-radius:12px;padding:4px 10px;margin:3px}</style></head>
<body><h2>Lyderių lentelė (admin)</h2>
<input id="k" type="password" placeholder="Admin raktas"> <button id="go">Rodyti</button>
<p><button id="cd">Išvalyti šiandienos</button> <button id="ca">Išvalyti viską</button></p>
<div id="o">Įrašyk ADMIN_KEY reikšmę ir paspausk „Rodyti“.</div>
<h3>Draudžiami vardų žodžiai</h3><input id="bw" placeholder="žodis"> <button id="ba">Pridėti</button><div id="bl"></div>
<script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(b){b.key=$("k").value;return fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function rows(t,l,full){return "<h3>"+t+"</h3>"+(l.length?l.map(function(x){var n=esc(x.n);return '<div class="r"><span>'+n+'</span><b>'+x.p+'</b>'+(full?'<button data-a="ren" data-n="'+n+'">Vardas</button><button data-a="set" data-n="'+n+'">Taškai</button>':'')+'<button data-a="del" data-n="'+n+'">Ištrinti</button></div>'}).join(""):"<p>Tuščia</p>")}
function show(d){if(d.error){$("o").innerHTML='<span class="err">'+esc(d.error)+'</span>';return}$("o").innerHTML=rows("Viso",d.all,1)+rows("Šiandien",d.day,0);$("bl").innerHTML=(d.banned&&d.banned.length)?d.banned.map(function(w){return '<span class="tag">'+esc(w)+' <a href="#" data-u="'+esc(w)+'">x</a></span>'}).join(""):"Nėra"}
function run(b){api(b).then(show).catch(function(){$("o").innerHTML='<span class="err">Serveris neatsako arba tai sena serverio versija (atidaryk /api/version)</span>'})}
$("go").onclick=function(){$("o").textContent="Kraunama...";run({})};$("k").onkeydown=function(e){if(e.key==="Enter")$("go").onclick()};
$("cd").onclick=function(){if(confirm("Išvalyti šiandienos lentelę?"))run({clear:"day"})};
$("ca").onclick=function(){if(confirm("IŠVALYTI VISĄ lentelę?"))run({clear:"all"})};
$("ba").onclick=function(){var w=$("bw").value.trim();if(w){run({ban:w});$("bw").value=""}};
$("bl").onclick=function(e){var a=e.target.closest("a");if(a){e.preventDefault();run({unban:a.getAttribute("data-u")})}};
$("o").onclick=function(e){var b=e.target.closest("button");if(!b)return;var n=b.getAttribute("data-n"),a=b.getAttribute("data-a");
 if(a==="del"){if(confirm("Ištrinti "+n+"?"))run({del:n})}
 else if(a==="ren"){var t=prompt("Naujas vardas:",n);if(t)run({rename:{from:n,to:t}})}
 else if(a==="set"){var p=prompt("Nauji taškai (viso) vardui "+n+":");if(p!==null&&p!=="")run({set:{n:n,p:+p}})}};
</script></body></html>
